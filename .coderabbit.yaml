# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
# CodeRabbit: PR code review only. Every summary/walkthrough/decorative surface
# is off, so the bot posts inline review comments and nothing else. Inert until
# the CodeRabbit GitHub App is installed on chizhangucb/nisse.
language: en-US

reviews:
  auto_review:
    enabled: true
  # Kill the chatty surfaces — keep only line-level review comments.
  high_level_summary: false
  poem: false
  review_status: false
  collapse_walkthrough: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false

chat:
  art: false
  auto_reply: false
