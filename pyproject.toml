# Ruff config only — nisse ships no Python package, this file exists so CI and
# local runs lint the same way. Scope is the codebase under scripts/; the
# harness glue in .claude/ is excluded (it is enforcement machinery with its
# own conventions, edited only under governance/building.md's hook rule).
[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# session_close.py embeds multi-line LLM prompt templates; those string
# literals are intentionally long and must not be reflowed.
"scripts/session_close.py" = ["E501"]
