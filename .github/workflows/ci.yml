# Hold `main` to the tests and the lint standard.
#
# nisse is stdlib-only Python; there is no build step and no browser. Each job
# is a required status check on `main` (branch protection references the bare
# job ids: test, lint). Keep the ids stable: renaming one leaves a required
# check that never reports, and every PR then hangs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Install gitleaks
        # The push-guard tests are integration tests over a throwaway repo; they
        # skip themselves without a scanner on PATH, so CI installs the binary to
        # keep them from silently passing as skips. Not the gitleaks action: that
        # scans this repo, which is a different job from putting it on PATH.
        run: |
          version=8.28.0
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run tests
        run: python -m pytest scripts/tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff
        run: ruff check .
