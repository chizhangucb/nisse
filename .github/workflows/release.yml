# Tag-based release notes. No CD: nisse ships no artifact, this only turns a
# `vX.Y.Z` tag into a GitHub Release with auto-generated notes from the commits
# and merged PRs since the previous tag.
#
# Cut a release:  git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release with generated notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
